name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [quick, full]
        include:
          - os: ubuntu-latest
            wrapper: ./mvnw
          - os: windows-latest
            wrapper: .\mvnw.cmd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests with coverage
        shell: pwsh
        run: |
          $arguments = @('-B', 'test')
          if ('${{ matrix.suite }}' -eq 'quick') { $arguments += '-Pquick' }
          & '${{ matrix.wrapper }}' @arguments
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.suite }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Check formatting and new SpotBugs findings
        run: ./mvnw -B -DskipTests compile spotless:check spotbugs:check
      - name: Enforce production source size
        run: python scripts/check-source-size.py
      - name: Validate frozen CLI regression controller
        run: python -m unittest discover -s benchmarks/swebench-cli -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis
          path: target/spotbugsXml.xml
          retention-days: 7

  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/cache@v4
        with:
          path: target/dependency-check-data
          key: dependency-check-12.2.2-${{ github.run_id }}
          restore-keys: dependency-check-12.2.2-
      - name: Scan dependencies
        run: ./mvnw -B dependency-check:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check
          path: target/dependency-check-report.*
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, quality, dependency-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: devcli-jar
          path: target/devcli-*.jar
          retention-days: 7
